/* 老数据向后兼容：补齐新版本才有的字段，不动已有内容 */
var pendingSubDue=null;
function normalizeTask(t){
  if(!Array.isArray(t.subtasks))t.subtasks=[];
  t.subtasks.forEach(function(s){if(typeof s.due!=="string")s.due="";if(typeof s.doneAt!=="number")s.doneAt=0;if(typeof s.done!=="boolean")s.done=!!s.done;if(typeof s.priority!=="string"||s.priority==="P0"||s.priority==="P1"||s.priority==="P2"){if(s.priority==="P0")s.priority="high";else if(s.priority==="P1")s.priority="mid";else if(s.priority==="P2")s.priority="low";else s.priority="";}else if(!s.priority)s.priority="";if(typeof s.noteId!=="string")s.noteId="";if(s.status!=="todo"&&s.status!=="doing"&&s.status!=="done")s.status=s.done?"done":"todo";if(s.status==="done"&&!s.done){s.done=true;s.doneAt=Date.now()}});
  if(!Array.isArray(t.logs))t.logs=[];
  if(!Array.isArray(t.tags))t.tags=[];
  if(typeof t.clientId!=="string")t.clientId="";
  if(typeof t.noteId!=="string")t.noteId="";
  if(typeof t.planned!=="boolean")t.planned=false;
  if(typeof t.important!=="boolean")t.important=false;
  if(typeof t.doneAt!=="number")t.doneAt=0;
  t.logs.forEach(function(l){if(typeof l.type!=="string"||!l.type)l.type="note"});
  if(t.done)t.planned=false;
  if(t.priority==="P0"||t.priority==="高"||t.priority==="最高"||t.priority==="高 最高")t.priority="high";
  else if(t.priority==="P1"||t.priority==="中"||t.priority==="重要"||t.priority==="中 重要")t.priority="mid";
  else if(t.priority==="P2"||t.priority==="低"||t.priority==="普通"||t.priority==="低 普通")t.priority="low";
  else if(t.priority!=="high"&&t.priority!=="mid"&&t.priority!=="low")t.priority="low";
  return t;
}
function normalizeProject(p){
  if(typeof p.reviewCycle!=="string")p.reviewCycle="";
  if(typeof p.nextReview!=="string")p.nextReview="";
  if(typeof p.budget!=="number"||!isFinite(p.budget))p.budget=0;
  if(typeof p.contract!=="number"||!isFinite(p.contract))p.contract=0;
  if(typeof p.summary!=="string")p.summary="";
  if(typeof p.goal!=="string")p.goal="";
  p.color=safeColor(p.color,CLIENT_COLORS[0]);
  if(typeof p.status!=="string"||!p.status)p.status=(db&&db.projStages&&db.projStages[0]?db.projStages[0].id:"");
  if(typeof p.landing!=="string")p.landing="";
  p.isContract=(p.isContract===1||p.isContract===true);
  if(typeof p.signDate!=="string")p.signDate="";
  if(typeof p.landYear!=="number")p.landYear=0;
  /* A1/C2：项目归属客户 —— 任务的客户默认由它推导 */
  if(typeof p.clientId!=="string")p.clientId="";
  return p;
}
function normalizeStage(s){
  if(typeof s.id!=="string"||!s.id)s.id="st_"+(Date.now().toString(36));
  if(typeof s.name!=="string")s.name="阶段";
  if(typeof s.ord!=="number")s.ord=0;
  if(typeof s.landed!=="number")s.landed=0;
  return s;
}
var DEFAULT_PROJ_STAGES=[["st_pre","售前阶段",1,0],["st_sign","合同签订",2,1],["st_deliver","交付中",3,1],["st_accept","已验收",4,1]];
function normalizeClient(c){if(typeof c.category!=="string")c.category="";c.color=safeColor(c.color,CLIENT_COLORS[0]);return c}
function normalizeNote(n){
  if(typeof n.id!=="string"||!n.id)n.id=uid();
  if(typeof n.title!=="string")n.title="";
  if(typeof n.md!=="string")n.md="";
  if(typeof n.cat!=="string")n.cat="";
  if(typeof n.pinned!=="boolean")n.pinned=false;
  /* E3：多标签是数组字段，老数据没有 → 补齐成空数组。
     必须补齐而不是留给下游兜底，否则写库时会序列化成 "null"。 */
  if(!Array.isArray(n.tags))n.tags=[];
  if(typeof n.createdAt!=="number")n.createdAt=Date.now();
  if(typeof n.updatedAt!=="number")n.updatedAt=n.createdAt;
  return n;
}
function normalizeTag(tg){if(typeof tg.category!=="string")tg.category="";tg.color=safeColor(tg.color,TAG_COLORS[0]);return tg}
/* 颜色只允许 #rgb / #rrggbb。颜色值会直接拼进 style="background:…"，
   而「导入备份」是不可信输入 —— 非颜色文本在这里就拦掉，别等到渲染时才防。 */
function safeColor(v,fallback){
  var s=String(v==null?"":v).trim();
  return /^#[0-9a-fA-F]{3}(?:[0-9a-fA-F]{3})?$/.test(s)?s:fallback;
}
/* 全量归一化（load 与 tryImport 共用）：补齐所有新版本字段，防旧备份脏数据击穿渲染 */
function normalizeAll(d){
  if(!Array.isArray(d.tasks))throw 0;
  d.tasks.forEach(normalizeTask);
  if(!Array.isArray(d.projStages))d.projStages=[];
  if(!d.projStages.length)d.projStages=DEFAULT_PROJ_STAGES.map(function(s){return {id:s[0],name:s[1],ord:s[2],landed:s[3]?1:0}});
  d.projStages.forEach(normalizeStage);
  if(!Array.isArray(d.projects))d.projects=[];
  d.projects.forEach(normalizeProject);
  if(!Array.isArray(d.clients))d.clients=[];
  d.clients.forEach(normalizeClient);
  if(!Array.isArray(d.tags))d.tags=[];
  d.tags.forEach(normalizeTag);
  if(!Array.isArray(d.notes))d.notes=[];
  d.notes.forEach(normalizeNote);
  /* 清掉指向"已不存在的标签"的孤儿 id：删过标签的旧数据、或导入的备份都可能带进来。
     留着的话界面上看不见、却会一直被写回库里，数据越攒越脏。 */
  var validTagIds=d.tags.map(function(tg){return tg.id});
  var dropOrphanTags=function(o){if(Array.isArray(o.tags))o.tags=o.tags.filter(function(tid){return validTagIds.indexOf(tid)>=0})};
  d.notes.forEach(dropOrphanTags);
  d.tasks.forEach(dropOrphanTags);
  if(!Array.isArray(d.noteCats))d.noteCats=["未归类"];
  if(d.noteCats.indexOf("未归类")<0)d.noteCats.unshift("未归类");
  if(!Array.isArray(d.smartLists))d.smartLists=[];
  d.smartLists.forEach(function(sl){if(sl&&sl.query&&Array.isArray(sl.query.pri))sl.query.pri=sl.query.pri.map(function(p){return p==="P0"?"high":p==="P1"?"mid":p==="P2"?"low":p})});
  if(!d.prefs||typeof d.prefs!=="object")d.prefs={pid:"",pri:"low"};
  return d;
}
async function load(){
  try{
    var raw=await invoke("load_store",{key:KEY});
    if(!raw){db=normalizeAll(emptyData());await saveNow();return}
    var d=JSON.parse(raw);
    if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.projects))throw 0;
    db=normalizeAll(d);
  }catch(e){db=normalizeAll(emptyData());try{await saveNow()}catch(_){}}
  try{await initNoti()}catch(_){}
}
async function initNoti(){
  try{var nr=await invoke("load_store",{key:NOTIKEY});if(nr){var no=JSON.parse(nr);noti.on=!!no.on;noti.lead=no.lead||60}}catch(e){}
  notiFired={};checkNoti();setInterval(checkNoti,60000);
}
function checkNoti(){
  if(!noti.on||!db||!db.tasks)return;
  var now=Date.now(),lead=(noti.lead||60)*60000;
  db.tasks.forEach(function(t){
    if(t.done||!t.due)return;
    var d=new Date(t.due+"T00:00:00").getTime();
    if(d>=now-6e5&&d<=now+lead){
      var k=t.id+"@"+t.due;if(notiFired[k])return;notiFired[k]=true;
      invoke("notify",{title:"任务即将到期",body:t.title}).catch(function(){});
    }
  });

/* ---------- E1 写盘：150ms 防抖合并 + 失败自动重试 ---------- */
var saveTimer=null,saveBusy=false,saveDirty=false,saveTries=0;
function save(){saveDirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,150)}
function saveNow(){clearTimeout(saveTimer);saveDirty=true;return flushSave()}
async function flushSave(){
  if(saveBusy||!saveDirty)return;
  saveBusy=true;saveDirty=false;
  var snap;
  try{snap=JSON.stringify(db)}catch(e){saveBusy=false;banner("数据序列化失败，无法保存："+(e&&e.message?e.message:e),"err");return}
  try{
    await invoke("save_store",{key:KEY,value:snap});
    if(saveTries){saveTries=0;var bn=$("#banner");if(bn)bn.innerHTML=""}
    saveBusy=false;
    if(saveDirty){clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,60)}
  }catch(e){
    saveBusy=false;saveDirty=true;saveTries++;
    if(saveTries<=3){
      banner("保存暂时失败，正在第 "+saveTries+" 次重试…");
      clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,saveTries*400);
    }else{
      banner("数据保存失败："+(e&&e.message?e.message:e)+"　请立刻用「导出备份」把内容复制出来，避免丢失！","err");
    }
  }
}
window.addEventListener("beforeunload",function(){if(ui.view==="notes"){try{flushNoteEditor()}catch(e){}}if(saveDirty){clearTimeout(saveTimer);flushSave()}});
document.addEventListener("visibilitychange",function(){if(document.hidden&&saveDirty){clearTimeout(saveTimer);flushSave()}});

/* ---------- D4 上次备份时间 ---------- */
function backupInfo(){
  var raw=db&&db.exportedAt?new Date(db.exportedAt):null;
  if(!raw||isNaN(+raw))return{never:true,warn:true,txt:"还没有导出过备份",sub:"建议现在导出一份，换设备或误操作时能立刻恢复"};
  var days=Math.floor((Date.now()-+raw)/864e5),p=function(n){return String(n).padStart(2,"0")};
  var when=(raw.getMonth()+1)+"月"+raw.getDate()+"日 "+p(raw.getHours())+":"+p(raw.getMinutes());
  var ago=days<=0?"今天":days===1?"昨天":"距今 "+days+" 天";
  return{never:false,warn:days>=7,days:days,txt:"上次备份："+when+"（"+ago+"）",
    sub:days>=14?"已经超过两周没备份了，导一份吧":days>=7?"超过一周没备份了，建议导一份":"备份还很新鲜"};
}

function proj(id){for(var i=0;i<db.projects.length;i++)if(db.projects[i].id===id)return db.projects[i];return null}
function stageById(id){if(!db.projStages)return null;for(var i=0;i<db.projStages.length;i++)if(db.projStages[i].id===id)return db.projStages[i];return null}
function task(id){for(var i=0;i<db.tasks.length;i++)if(db.tasks[i].id===id)return db.tasks[i];return null}
function pct(t){if(!t.subtasks.length)return t.done?1:0;var d=0;t.subtasks.forEach(function(s){if(s.done)d++});return d/t.subtasks.length}
function statusOf(t){
  if(t.done)return "done";
  if(t.status==="todo"||t.status==="doing")return t.status;
  if(t.subtasks.length&&t.subtasks.some(function(s){return s.done}))return "doing";
  return "todo";
}
function stLabel(s){return s==="doing"?"进行中":s==="done"?"已完成":"待办";}
function setStatus(t,st){
  if(st==="done"){t.done=true;t.doneAt=Date.now();t.subtasks.forEach(function(s){if(!s.done){s.done=true;s.doneAt=Date.now()}});t.status="done";}
  else{
    if(t.done){t.done=false;t.doneAt=0;}
    t.status=st;
  }
}
/* 计算任务所属四象限（1重要紧急 2重要不紧急 3紧急不重要 4不重要不紧急） */
function quadOf(t){var imp=!!t.important,urg=!!t.due&&dayDiff(t.due)<=3;return imp?(urg?1:2):(urg?3:4);}
/* 象限中文名 */
function quadName(qn){return ["","重要 · 紧急","重要 · 不紧急","紧急 · 不重要","不重要 · 不紧急"][qn]||"";}
/* 按分类分组，未归类置顶；空分类统一归入未归类。category 非字符串（旧备份可能存数字）一律当空串处理 */
function groupByCat(arr){
  var g={};arr.forEach(function(x){var k=(typeof x.category==="string"?x.category:"").trim();if(!k)k="未归类";(g[k]=g[k]||[]).push(x)});
  var keys=Object.keys(g),ordered=[];
  if(g["未归类"])ordered.push("未归类");
  keys.filter(function(k){return k!=="未归类"}).sort(function(a,b){return a.localeCompare(b,"zh")}).forEach(function(k){ordered.push(k)});
  return ordered.map(function(k){return {name:k,items:g[k]}});
}

/* ---------- C1 等待中 / C2 逾期治理 / E6 久未跟进 ---------- */
var STALE_DAYS=7,DEEP_OD=7;
function lastTouch(t){
  var m=t.createdAt||0;
  (t.logs||[]).forEach(function(l){if(l.at>m)m=l.at});
  (t.subtasks||[]).forEach(function(s){if(s.doneAt&&s.doneAt>m)m=s.doneAt});
  return m;
}
function staleDays(t){var m=lastTouch(t);if(!m)return 0;return Math.floor((Date.now()-m)/864e5)}
function staleList(){return db.tasks.filter(function(t){return !t.done&&staleDays(t)>=STALE_DAYS}).sort(function(a,b){return lastTouch(a)-lastTouch(b)})}
function deepOverdue(){return db.tasks.filter(function(t){return !t.done&&t.due&&dayDiff(t.due)<=-DEEP_OD})}
function addLog(t,text,type){t.logs=t.logs||[];t.logs.push({id:uid(),at:Date.now(),text:text,type:type||"note"})}

}

/* 顶部 KPI 卡片 —— 取代原来右侧面板里的「今日概览」。
   内容一样（待办 / 逾期 / 进行中 / 已完成），但改成一行铺在主内容区顶部：
   不再永久占用一列宽度，也不用先去点「收起面板」。
   始终显示（包括空库时的四个 0）—— 它是版式的一部分，也是任务量的第一眼读数；
   卡片同时是入口：点一下钻到「任务」页并按该口径过滤，计数为 0 时置灰不可点。 */
var KPI_VIEWS=["today","all","calendar","quadrant","logbook","projects"];
var KF_LABEL={todo:"待办",od:"逾期",doing:"进行中",done:"已完成"};
function kpiStrip(){
  var todo=0,od=0,doing=0,done=0;
  db.tasks.forEach(function(t){
    if(t.done){done++;return}
    todo++;
    if(t.due&&dayDiff(t.due)<0)od++;
    if(t.status==="doing"||((t.subtasks||[]).some(function(s){return s.done})))doing++;
  });
  function kpi(n,label,cls,kf){
    /* 计数为 0 时不带状态色 —— 颜色只用来提示「这里有东西要看」，0 就该是安静的灰 */
    var cl=(cls&&n)?" "+cls:"";
    return '<button type="button" class="kpi'+cl+(ui.kf===kf?" on":"")+'" data-act="kpi" data-id="'+kf+'"'+
      (n?"":" disabled")+' title="'+(n?"查看"+label+"任务":"暂无"+label+"任务")+'">'+
      '<span class="kpi-n">'+n+'</span><span class="kpi-l">'+label+"</span></button>";
  }
  return '<div class="kpi-strip" role="group" aria-label="任务概览">'+
    kpi(todo,"待办","","todo")+kpi(od,"逾期",od?"warn":"","od")+kpi(doing,"进行中","doing","doing")+kpi(done,"已完成","done","done")+"</div>";
}
/* KPI 钻取口径 —— 叠加在全局 filtered() 之上，只在「任务」页生效 */
function kpiFiltered(){
  var a=filtered();
  if(ui.kf==="todo")return a.filter(function(t){return !t.done});
  if(ui.kf==="done")return a.filter(function(t){return t.done});
  if(ui.kf==="doing")return a.filter(function(t){return !t.done&&(t.status==="doing"||(t.subtasks||[]).some(function(s){return s.done}))});
  if(ui.kf==="od")return a.filter(function(t){return !t.done&&t.due&&dayDiff(t.due)<0});
  return a;
}
/* 钻取提示芯片：和优先级芯片同排，点一下（或点 KPI 卡片本身）即取消 */
function kfChip(){
  if(ui.kf==="all"||!KF_LABEL[ui.kf])return "";
  return '<button class="fchip on kf" data-act="kpi" data-id="all" title="取消「'+KF_LABEL[ui.kf]+'」筛选">'+icon(IC.x,12)+KF_LABEL[ui.kf]+"</button>";
}
function inspTask(t){
  var subs=t.subtasks||[],sd=subs.filter(function(s){return s.done}).length,pct=subs.length?Math.round(sd/subs.length*100):(t.done?100:0);
  var stCls={todo:"",doing:"doing",done:"done"}[statusOf(t)]||"";
  var m='<div class="insp-head"><span class="ih-t">任务详情</span><button class="insp-toggle" data-act="toggleInsp" title="收起面板  ⌘\\">'+icon(IC.x,14)+'</button></div>';
  m+='<div class="insp-card">';
  m+='<div class="insp-title">'+esc(t.title)+'</div>';
  m+='<div class="insp-chips"><span class="chip '+stCls+'">'+stLabel(statusOf(t))+'</span><span class="chip '+priKey(t.priority)+'">'+PRI[priKey(t.priority)]+'</span>'+(t.important?'<span class="chip imp" data-act="toggleImportant" data-id="'+t.id+'" title="点击取消重要标记" style="cursor:pointer">★ 重要</span>':'')+(t.due?'<span class="chip '+(dayDiff(t.due)<0?"od":"")+'">'+fmtDue(t.due)+'</span>':'')+'</div>';
  m+='<div class="insp-row"><span class="ir-k">客户</span><span class="ir-v">'+(clientNameOf(t.clientId)||"—")+'</span></div>';
  m+='<div class="insp-row"><span class="ir-k">项目</span><span class="ir-v">'+(proj(t.projectId)?esc(proj(t.projectId).name):"—")+'</span></div>';
  m+='<div class="insp-row"><span class="ir-k">子任务</span><span class="ir-v">'+sd+' / '+subs.length+(subs.length?('  ('+pct+'%)'):'')+'</span></div>';
  m+='<div class="insp-prog"><i style="width:'+pct+'%"></i></div>';
  var logs=(t.logs||[]).slice().reverse().slice(0,3);
  if(logs.length){m+='<div style="margin-top:8px">';logs.forEach(function(l){m+='<div class="insp-log"><span class="il-t">'+fmtAgo(l.at)+'</span> '+esc(l.text)+'</div>';});m+='</div>';}
  m+='<div class="insp-acts"><button class="btn-primary" data-act="editModal" data-id="'+t.id+'">'+icon(IC.pencil,15)+'编辑</button>'+(t.done?'<button class="btn-ghost" data-act="toggleTask" data-id="'+t.id+'">'+icon(IC.rotate,15)+'重开</button>':'<button class="btn-ghost" data-act="toggleTask" data-id="'+t.id+'">'+icon(IC.check,15)+'完成</button>')+'<button class="btn-danger" data-act="del" data-id="'+t.id+'">'+icon(IC.trash,15)+'删除</button></div>';
  m+='</div>';
  m+='<div class="insp-card insp-empty">双击卡片或点「编辑」打开完整编辑面板。</div>';
  return m;
}
/* 右侧面板只在"有东西可看"时出现：选中了任务 → 任务详情；落在某个具体项目上 → 项目详情。
   没有选中时整块隐藏（清空 + display:none），主内容区因此拿到全宽。
   原来的「今日概览」已经搬到主内容区顶部的 KPI 卡片，不再占这个位置。 */
function inspHasContent(){
  if(ui.view==="projects"&&ui.pid&&ui.pid!=="all")return !!proj(ui.pid);
  return !!(ui.selId&&task(ui.selId));
}
function renderInsp(){
  var el=$("#insp");if(!el)return;
  var on=inspHasContent();
  /* 顶栏的「收起 / 展开面板」跟着面板一起显隐（edit 只重渲染检查器，不重排列表，
     所以按钮的可见性必须在这里对齐，否则会停在上一轮的状态） */
  var tb=document.querySelector('#main [data-act="toggleInsp"]');
  if(tb)tb.style.display=on?"":"none";
  if(ui.view==="notes"||!on){el.innerHTML="";el.classList.remove("collapsed");el.style.display="none";return}
  el.style.display="";
  el.innerHTML=(ui.view==="projects"&&ui.pid&&ui.pid!=="all")?inspProject(proj(ui.pid)):inspTask(task(ui.selId));
}
function projTaskItem(t){
  return '<div class="in-it" data-act="edit" data-id="'+t.id+'"><span class="cdot" style="background:'+dotColor(t)+'"></span><span class="it-t">'+esc(t.title)+'</span>'+(t.due?'<span class="it-d'+(dayDiff(t.due)<0?' od':'')+'">'+fmtDue(t.due)+'</span>':'')+'</div>';
}
function inspProject(p){
  var ts=db.tasks.filter(function(t){return t.projectId===p.id});
  var doing=ts.filter(function(t){return !t.done&&(t.status==="doing"||(t.subtasks.length&&t.subtasks.some(function(s){return s.done})))});
  var todo=ts.filter(function(t){return !t.done&&doing.indexOf(t)<0});
  var st=ui.selId?task(ui.selId):null;
  var m='<div class="insp-head"><span class="ih-t">'+esc(p.name)+'</span><div class="insp-acts" style="margin-top:0">'
        +'<button class="iact" data-act="editProject" data-id="'+p.id+'" title="编辑">'+icon(IC.pencil,14)+'</button>'
        +'<button class="iact danger" data-act="delProject" data-id="'+p.id+'" title="删除项目">'+icon(IC.trash,14)+'</button></div></div>';
  m+='<div class="insp-card"><div class="ip-h">摘要信息</div><div class="ip-body">'+(p.summary?esc(p.summary):'<span class="muted">未填写</span>')+'</div></div>';
  m+='<div class="insp-card"><div class="ip-h">核心目标</div><div class="ip-body">'+(p.goal?esc(p.goal):'<span class="muted">未填写</span>')+'</div></div>';
  m+='<div class="insp-card"><div class="ip-h">进行中任务 ('+doing.length+')</div>'+(doing.length?'<div class="insp-near">'+doing.map(projTaskItem).join("")+'</div>':'<div class="muted" style="font-size:13px;padding:2px 0">暂无进行中的任务</div>')+'</div>';
  m+='<div class="insp-card"><div class="ip-h">待办任务 ('+todo.length+')</div>'+(todo.length?'<div class="insp-near">'+todo.map(projTaskItem).join("")+'</div>':'<div class="muted" style="font-size:13px;padding:2px 0">暂无待办任务</div>')+'</div>';
  m+='<div class="insp-card"><div class="ip-h">当前任务详情</div>'+(st?inspTask(st):'<div class="muted" style="font-size:13px;padding:2px 0">点上方任务查看详情</div>')+'</div>';
  return m;
}

/* ===================== 笔记模块（类 Obsidian 的 Markdown 笔记） ===================== */
function fmtAgo(ts){var d=Date.now()-(ts||0);if(d<60000)return"刚刚";if(d<3600000)return Math.floor(d/60000)+" 分钟前";if(d<86400000)return Math.floor(d/3600000)+" 小时前";if(d<86400000*7)return Math.floor(d/86400000)+" 天前";var dt=new Date(ts);return (dt.getMonth()+1)+"/"+dt.getDate();}
function sanitizeUrl(u){
  u=(u||"").trim();
  if(/^(https?:|mailto:|#|\/)/i.test(u))return u;
  if(/^[\w.%-]+@[\w.-]+\.[a-z]{2,}$/i.test(u))return "mailto:"+u;
  return "#";
}
/* 行内 Markdown：加粗/斜体/删除线/行内代码/链接（先做占位避免互相干扰，最后还原） */
function inlineMd(s){
  if(s==null)return "";
  var codes=[],links=[],wls=[];
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,function(_,c){codes.push(c);return " Lc"+(codes.length-1)+"Lc ";});
  /* E5：[[笔记标题]] → 双链。已存在的笔记可点击跳转；不存在的显示为「待创建」，点一下即可新建。 */
  s=s.replace(/\[\[([^\[\]]+)\]\]/g,function(_,t){wls.push(t);return " Lw"+(wls.length-1)+"Lw ";});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(_,t,u){links.push([t,u]);return " Ll"+(links.length-1)+"Ll ";});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<strong>$1</strong>");
  s=s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>").replace(/(^|[^_A-Za-z0-9])_([^_\n]+)_/g,"$1<em>$2</em>");
  s=s.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  s=s.replace(/ Ll(\d+)Ll /g,function(_,i){var l=links[+i];return '<a href="'+sanitizeUrl(l[1])+'" target="_blank" rel="noopener">'+l[0]+"</a>";});
  s=s.replace(/ Lw(\d+)Lw /g,function(_,i){
    var t=wls[+i],ex=noteByTitle(t);
    return '<a class="wikilink'+(ex?"":" missing")+'" data-wl="'+t+'" href="javascript:void(0)" title="'+(ex?"打开「"+t+"」":"还没有这篇笔记，点击创建")+'">'+t+(ex?"":" <span class=\"wl-new\">＋</span>")+"</a>";
  });
  s=s.replace(/ Lc(\d+)Lc /g,function(_,i){return "<code>"+codes[+i]+"</code>";});
  return s;
}
/* Markdown -> HTML（块级解析；XSS 安全：文本先转义，仅生成白名单标签） */
function md2html(md){
  if(!md)return "";
  var lines=md.replace(/\r\n/g,"\n").split("\n"),out=[],i=0,para=[];
  function flush(){if(para.length){out.push("<p>"+inlineMd(para.join("\n")).replace(/\n/g,"<br>")+"</p>");para=[];}}
  while(i<lines.length){
    var line=lines[i];
    var fm=line.match(/^```(\w*)\s*$/);
    if(fm){flush();i++;var code=[];while(i<lines.length&&!/^```\s*$/.test(lines[i])){code.push(lines[i]);i++;}i++;out.push('<pre class="md-pre"><code>'+esc(code.join("\n"))+"</code></pre>");continue;}
    var hm=line.match(/^(#{1,6})\s+(.*)$/);
    if(hm){flush();var lv=hm[1].length;out.push("<h"+lv+">"+inlineMd(hm[2])+"</h"+lv+">");i++;continue;}
    if(/^(---|\*\*\*|___)\s*$/.test(line)){flush();out.push("<hr>");i++;continue;}
    if(/^>\s?/.test(line)){flush();var q=[];while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++;}out.push("<blockquote>"+inlineMd(q.join("\n")).replace(/\n/g,"<br>")+"</blockquote>");continue;}
    if(/^[-*+]\s+/.test(line)){flush();var ul=[];while(i<lines.length&&/^[-*+]\s+/.test(lines[i])){ul.push(lines[i].replace(/^[-*+]\s+/,""));i++;}out.push("<ul>"+ul.map(function(it){return "<li>"+inlineMd(it)+"</li>";}).join("")+"</ul>");continue;}
    if(/^\d+[.)]\s+/.test(line)){flush();var ol=[];while(i<lines.length&&/^\d+[.)]\s+/.test(lines[i])){ol.push(lines[i].replace(/^\d+[.)]\s+/,""));i++;}out.push("<ol>"+ol.map(function(it){return "<li>"+inlineMd(it)+"</li>";}).join("")+"</ol>");continue;}
    if(line.trim()===""){flush();i++;continue;}
    para.push(line);i++;
  }
  flush();
  return out.join("\n");
}
/* 行内 DOM -> Markdown（序列化富文本回 Markdown） */
function mdInlineOut(c){
  var s="";
  c.childNodes.forEach(function(ch){
    if(ch.nodeType===3){s+=ch.textContent;}
    else if(ch.nodeType===1){
      var tag=ch.tagName.toLowerCase(),inner=mdInlineOut(ch);
      if(tag==="strong"||tag==="b")s+="**"+inner+"**";
      else if(tag==="em"||tag==="i")s+="*"+inner+"*";
      else if(tag==="del"||tag==="s"||tag==="strike")s+="~~"+inner+"~~";
      else if(tag==="code")s+="`"+inner+"`";
      else if(tag==="a"){
        /* E5：双链回写为 [[标题]] 纯文本，保证导出的 Markdown 依然是可读的 */
        if(ch.classList&&ch.classList.contains("wikilink"))s+="[["+(ch.getAttribute("data-wl")||inner)+"]]";
        else s+="["+inner+"]("+(ch.getAttribute("href")||"")+")";
      }
      else if(tag==="br")s+="\n";
      else if(tag==="span"||tag==="font")s+=inner;
      else s+=inner;
    }
  });
  return s;
}
function hasBlockEl(c){
  for(var k=0;k<c.childNodes.length;k++){var n=c.childNodes[k];if(n.nodeType===1){var t=n.tagName.toLowerCase();if(/^(p|div|h1|h2|h3|h4|h5|h6|ul|ol|li|blockquote|pre|hr|table)$/.test(t))return true;}}
  return false;
}
function html2md(node){
  if(!node)return "";
  var res=[];
  function walk(n){
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){res.push(c.textContent);return;}
      if(c.nodeType!==1)return;
      var tag=c.tagName.toLowerCase();
      if(/^h[1-6]$/.test(tag)){var lv=+tag[1];res.push("\n"+"#".repeat(lv)+" "+mdInlineOut(c)+"\n");}
      else if(tag==="p"){res.push("\n"+mdInlineOut(c)+"\n");}
      else if(tag==="br"){res.push("\n");}
      else if(tag==="hr"){res.push("\n---\n");}
      else if(tag==="blockquote"){res.push("\n");mdInlineOut(c).split("\n").forEach(function(l){res.push("> "+l+"\n");});}
      else if(tag==="ul"){res.push("\n");c.childNodes.forEach(function(li){if(li.nodeType===1&&li.tagName.toLowerCase()==="li")res.push("- "+mdInlineOut(li)+"\n");});}
      else if(tag==="ol"){res.push("\n");var k=1;c.childNodes.forEach(function(li){if(li.nodeType===1&&li.tagName.toLowerCase()==="li"){res.push(k+". "+mdInlineOut(li)+"\n");k++;}});}
      else if(tag==="pre"){var code=c.querySelector?c.querySelector("code"):null;var txt=code?code.textContent:c.textContent;res.push("\n```\n"+txt+"\n```\n");}
      else if(tag==="div"){if(hasBlockEl(c)){walk(c);}else{res.push("\n"+mdInlineOut(c)+"\n");}}
      else if(tag==="a"){
        if(c.classList&&c.classList.contains("wikilink")){res.push("[["+(c.getAttribute("data-wl")||mdInlineOut(c))+"]]");}
        else{res.push("["+mdInlineOut(c)+"]("+(c.getAttribute("href")||"")+")");}
      }
      else{res.push(mdInlineOut(c));}
    });
  }
  walk(node);
  return res.join("").replace(/\n{3,}/g,"\n\n").replace(/^\n+/,"").replace(/\n+$/,"")+"\n";
}
/* ---- 数据访问 ---- */
function currentNote(){return db.notes.filter(function(n){return n.id===ui.noteId})[0]||null;}
function noteCatList(){var s=db.noteCats.slice();if(s.indexOf("未归类")<0)s.unshift("未归类");return s;}
/* E5：按标题找笔记（双链解析用）。入参可能是已 HTML 转义的文本，两种都试一遍。 */
function noteByTitle(t){
  var k=(t||"").trim();if(!k)return null;
  for(var i=0;i<db.notes.length;i++){
    var nt=db.notes[i].title||"";
    if(nt===k||esc(nt)===k)return db.notes[i];
  }
  return null;
}
/* E3：笔记的多标签 */
function noteTagIds(n){return (n&&Array.isArray(n.tags))?n.tags:[]}
function noteTagChipsHtml(n){
  var cur=noteTagIds(n);
  if(!db.tags.length)return '<span class="ntag-none">还没有标签，点右侧「＋ 新建标签」创建一个</span>';
  return db.tags.map(function(tg){
    var on=cur.indexOf(tg.id)>=0;
    return '<button type="button" class="ntag'+(on?" on":"")+'" data-act="noteTagToggle" data-id="'+tg.id+'" title="'+(on?"点击移除":"点击添加")+'">'+
      '<span class="ntag-dot" style="background:'+(tg.color||"#999")+'"></span>'+esc(tg.name)+'</button>';
  }).join("");
}
function noteNewTagInline(){
  $("#modal").innerHTML='<div class="mask" data-act="maskClose"><div class="sheet" style="max-width:460px" data-sheet="1"><h3>新建标签</h3>'+
    '<div class="fld"><label>标签名称</label><input id="nnt" placeholder="例如：客户 A / 会议记录 / 灵感"></div>'+
    '<p class="muted" style="font-size:12px;margin:8px 0 0">标签与任务标签是同一套，创建后任务和笔记都能用。</p>'+
    '<div class="sheet-act"><button class="btn-ghost" data-act="closeModal">取消</button><button class="btn-pri" data-act="noteTagCreate">创建并挂上</button></div></div></div>';
  setTimeout(function(){var e=$("#nnt");if(e)e.focus()},30);
}
/* E5：反链 —— 解析当前笔记里的 [[ ]] 出链，并全量扫描其他笔记找出引用了本文的（个人知识库规模下无需额外表） */
function wikiTitlesIn(md){
  var out=[],re=/\[\[([^\[\]]+)\]\]/g,m,txt=md||"";
  while((m=re.exec(txt))){var t=m[1].trim();if(t&&out.indexOf(t)<0)out.push(t)}
  return out;
}
function backlinksOf(n){
  if(!n)return {out:[],inn:[]};
  var outTitles=wikiTitlesIn(n.md),out=[];
  outTitles.forEach(function(t){var x=noteByTitle(t);if(x&&out.indexOf(x)<0)out.push(x)});
  var title=(n.title||"").trim(),inn=[];
  if(title){
    var needle="[["+title+"]]";
    db.notes.forEach(function(o){if(o.id!==n.id&&(o.md||"").indexOf(needle)>=0)inn.push(o)});
  }
  return {out:out,inn:inn};
}
function backlinkPanelHtml(){
  var n=currentNote();if(!n)return "";
  var b=backlinksOf(n);
  if(!b.out.length&&!b.inn.length)
    return '<div class="bl-panel bl-none">'+icon(IC.link,13)+'<span>这篇还没和其他笔记建立链接。点工具栏「引用笔记」，或在正文里直接写 <code>[[笔记标题]]</code>。</span></div>';
  var h='<div class="bl-panel">';
  if(b.out.length)h+='<div class="bl-sec"><span class="bl-h">本文引用了 '+b.out.length+' 篇</span>'+b.out.map(function(x){return '<button class="bl-it" data-act="openNote" data-id="'+x.id+'" title="打开这篇笔记">'+icon(IC.link,12)+esc(x.title||"无标题笔记")+'</button>'}).join("")+'</div>';
  if(b.inn.length)h+='<div class="bl-sec"><span class="bl-h">被 '+b.inn.length+' 篇引用</span>'+b.inn.map(function(x){return '<button class="bl-it" data-act="openNote" data-id="'+x.id+'" title="打开这篇笔记">'+icon(IC.note,12)+esc(x.title||"无标题笔记")+'</button>'}).join("")+'</div>';
  h+='</div>';
  return h;
}
function refreshBacklinks(){
  var el=document.getElementById("backlinkBox");
  if(el)el.innerHTML=backlinkPanelHtml();
}
function openWikiLink(title){
  var t=(title||"").trim();if(!t)return;
  flushNoteEditor();
  var n=noteByTitle(t);
  if(n){ui.noteId=n.id;render();return;}
  ui.wikiNew=t;
  confirmBox("还没有「"+t+"」这篇笔记，现在创建并打开它吗？","wikiCreateYes");
}
function insertWikiLink(title){
  var ed=document.getElementById("noteEditor");if(!ed)return;
  var n=currentNote();if(!n)return;
  var link="[["+title+"]]";
  var exists=!!noteByTitle(title);
  /* 直接插入「看得见的双链」，而不是先塞纯文本等下次重渲染才生效 ——
     「引用笔记」是常驻可见入口，点完就该立刻是可点的链接，而不是一段源码。 */
  function makeLink(){
    var a=document.createElement("a");
    a.className="wikilink"+(exists?"":" missing");
    a.setAttribute("data-wl",title);
    a.setAttribute("href","javascript:void(0)");
    a.textContent=title;
    if(!exists){var s=document.createElement("span");s.className="wl-new";s.textContent="＋";a.appendChild(s);}
    return a;
  }
  var sel=window.getSelection();
  var r=(sel&&sel.rangeCount)?sel.getRangeAt(0):null;
  /* 光标确实落在编辑器里才就地插入；否则一律「安全追加到末尾」。
     绝不用 deleteContents 去动编辑器之外的选区、也绝不整段重写已有内容
     —— 「引用笔记」是常驻可见入口，点了必须有效，且不能误删用户的内容。 */
  if(r&&ed.contains(r.startContainer)){
    ed.focus();
    if(!r.collapsed)r.deleteContents();
    var a=makeLink();
    r.insertNode(a);
    /* 光标落在刚插入的链接「之后」（紧邻其后，而不是落进链接内部），方便继续输入 */
    r.setStartAfter(a);r.collapse(true);
    sel.removeAllRanges();sel.addRange(r);
    flushNoteEditor();
  }else{
    n.md=(n.md||"")+(n.md&&!/\n$/.test(n.md)?"\n":"")+link;
    n.updatedAt=Date.now();save();
    ed.innerHTML=md2html(n.md);
    var ls=ed.querySelectorAll("a.wikilink");
    if(ls.length){
      var after=document.createRange();after.setStartAfter(ls[ls.length-1]);after.collapse(true);
      var s2=window.getSelection();s2.removeAllRanges();s2.addRange(after);
    }
  }
  refreshBacklinks();
}

function noteFiltered(){
  var q=(ui.noteQ||"").trim().toLowerCase();
  return db.notes.filter(function(n){
    var cat=n.cat||"";
    if(ui.noteCat==="__uncat__"){if(cat&&db.noteCats.indexOf(cat)>=0)return false;}
    else if(ui.noteCat!=="all"){if(cat!==ui.noteCat)return false;}
    if(ui.noteTag&&noteTagIds(n).indexOf(ui.noteTag)<0)return false;
    if(q){
      var hay=(n.title+" "+(n.md||"")+" "+noteTagIds(n).map(function(id){var t=tagById(id);return t?t.name:""}).join(" ")).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  }).sort(function(a,b){
    if(!!a.pinned!==!!b.pinned)return a.pinned?-1:1;
    return (b.updatedAt||0)-(a.updatedAt||0);
  });
}
/* E4：搜索升级 —— 摘要不再永远取开头 80 字，而是围绕命中词截取片段 */
function notePlain(md){
  return (md||"").replace(/```[\s\S]*?```/g," ").replace(/\[\[([^\[\]]+)\]\]/g,"$1").replace(/[#>*_`~]/g," ").replace(/\n+/g," ").replace(/\s+/g," ").trim();
}
function noteSnip(md){return notePlain(md).slice(0,80);}
function noteSnippet(md,q){
  var p=notePlain(md);
  if(!q)return p.slice(0,80);
  var i=p.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return p.slice(0,80);
  var s=Math.max(0,i-28),e=Math.min(p.length,i+q.length+48);
  return (s>0?"…":"")+p.slice(s,e)+(e<p.length?"…":"");
}
function noteHitCount(n,q){
  if(!q)return 0;
  var k=q.toLowerCase(),c=0,pos=0;
  var hay=(n.title+"\n"+(n.md||"")).toLowerCase();
  while((pos=hay.indexOf(k,pos))>=0){c++;pos+=k.length}
  return c;
}
function hlText(s,q){
  if(!q)return esc(s);
  var i=s.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(s);
  return esc(s.slice(0,i))+'<mark class="nhit">'+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length));
}
/* D2：统一空状态组件 —— 每个空状态都要回答三件事：
   ①这里放什么 ②为什么有用 ③现在能做什么。空着不说话 = 把新用户晾在原地。 */
function emptyState(o){
  o=o||{};
  var acts=(o.acts||[]).map(function(b){
    return '<button class="'+(b.primary?"tbtn primary keep":"tbtn")+'" data-act="'+b.act+'"'+(b.id!=null?' data-id="'+b.id+'"':"")+'>'+(b.icon?icon(b.icon,14):"")+esc(b.label)+"</button>";
  }).join("");
  return '<div class="estate'+(o.cls?(" "+o.cls):"")+'">'+
    '<div class="est-ic">'+icon(o.icon||IC.list,o.big?34:26)+"</div>"+
    '<h4 class="est-t">'+esc(o.title||"")+"</h4>"+
    (o.why?'<p class="est-w">'+o.why+"</p>":"")+
    (acts?'<div class="est-acts">'+acts+"</div>":"")+
  "</div>";
}

    if(ui.noteTag)why+="当前标签是「"+esc(tagById(ui.noteTag)?tagById(ui.noteTag).name:"")+"」。<br>";
    if(ui.noteCat&&ui.noteCat!=="all"&&ui.noteCat!=="__uncat__")why+="当前分类是「"+esc(ui.noteCat)+"」。<br>";
    return emptyState({icon:IC.note,title:q?"没有匹配的笔记":"这里还没有笔记",why:why,

        '<div class="ni-snip">'+(q?hlText(noteSnippet(n.md,q),q):esc(noteSnip(n.md)||"（空）"))+'</div>'+
        (tgs?'<div class="ni-tagrow">'+tgs+"</div>":"")+
        '<div class="ni-foot"><span>'+fmtAgo(n.updatedAt)+(hits?' · <b class="ni-hits">'+hits+" 处匹配</b>":"")+'</span>'+(n.pinned?'<span class="pin">★ 置顶</span>':'')+'</div>'+

/* ---- 编辑器挂载与交互 ---- */
function mountNotes(){
  var ed=document.getElementById("noteEditor");
  if(ed){
    ed.innerHTML=md2html(currentNote()?currentNote().md:"");
    ed.addEventListener("input",function(){liveInline();noteEditDebounced();});
    ed.addEventListener("keydown",noteKeydown);
    ed.addEventListener("blur",function(){flushNoteEditor();});
    /* E5：正文里的 [[双链]] 变成可点击链接；未创建的显示为「待创建」 */
    ed.addEventListener("click",function(e){
      var a=e.target.closest?e.target.closest("a.wikilink"):null;
      if(a){e.preventDefault();openWikiLink(a.getAttribute("data-wl"));}
    });
  }
  var q=document.getElementById("noteQ");
  if(q){q.oninput=function(){ui.noteQ=q.value;var nl=document.getElementById("noteList");if(nl)nl.innerHTML=noteListHtml();};}
  /* E2：标题级别下拉 */
  var hs=document.getElementById("noteHSel");
  if(hs){hs.onchange=function(){var v=hs.value;hs.value="";if(v)noteCmd(v);};}
  var t=document.getElementById("noteTitle");
  if(t){
    t.oninput=function(){var n=currentNote();if(n){n.title=t.value;n.updatedAt=Date.now();var nl=document.getElementById("noteList");if(nl)nl.innerHTML=noteListHtml();save();}};
    /* E6：标题结尾写 #分类 再回车 → 自动归类（可见提示就在分类选择器旁边） */
    t.onkeydown=function(e){
      if(e.key!=="Enter")return;
      e.preventDefault();
      var n=currentNote();if(!n)return;
      var m=(t.value||"").match(/#([^\s#]+)\s*$/);
      if(!m)return;
      var cat=m[1];
      if(db.noteCats.indexOf(cat)<0)db.noteCats.push(cat);
      n.cat=cat;
      n.title=(t.value||"").replace(/#([^\s#]+)\s*$/,"").trim();
      n.updatedAt=Date.now();save();render();
      toast("已归类到「"+cat+"」");
    };
  }
  var sel=document.getElementById("noteCatSel");
  if(sel){sel.onchange=function(){
    var n=currentNote();if(!n)return;
    if(sel.value==="__new__"){noteNewCatInline(n);return;}
    n.cat=sel.value;n.updatedAt=Date.now();save();
    var nl=document.getElementById("noteList");if(nl)nl.innerHTML=noteListHtml();
  };}
}
var noteEditTimer=null;
function noteEditDebounced(){
  clearTimeout(noteEditTimer);
  noteEditTimer=setTimeout(function(){flushNoteEditor();var nl=document.getElementById("noteList");if(nl)nl.innerHTML=noteListHtml();},400);
}
function flushNoteEditor(){
  var ed=document.getElementById("noteEditor");if(!ed)return;
  var n=currentNote();if(!n)return;
  var md=html2md(ed);
  if(md!==(n.md||"")){n.md=md;n.updatedAt=Date.now();save();}
  refreshBacklinks();
}

}
function currentBlockEl(ed){
  var sel=window.getSelection();if(!sel.rangeCount)return null;
  var node=sel.anchorNode;var el=node.nodeType===3?node.parentElement:node;
  while(el&&el!==ed&&!/^(P|DIV|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|LI|PRE)$/.test(el.tagName))el=el.parentElement;
  return el&&el!==ed?el:null;
}
function placeCaretEnd(el){if(!el)return;var r=document.createRange();r.selectNodeContents(el);r.collapse(false);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
function placeCaretStart(el){if(!el)return;var r=document.createRange();r.selectNodeContents(el);r.collapse(true);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
/* 输入时把紧邻光标的成对 Markdown 标记实时渲染为富文本（Obsidian 式实时预览） */
function liveInline(){
  try{
    var sel=window.getSelection();if(!sel.rangeCount)return;
    var r=sel.getRangeAt(0),node=r.startContainer;
    if(node.nodeType!==3)return;
    var txt=node.textContent,pos=r.startOffset;
    var pats=[["**","**","strong"],["~~","~~","del"],["`","`","code"]];
    for(var i=0;i<pats.length;i++){
      var o=pats[i][0],c=pats[i][1],tag=pats[i][2];
      if(txt.slice(pos-c.length,pos)===c){
        var oi=txt.lastIndexOf(o,pos-c.length);
        if(oi>=0){
          var inner=txt.slice(oi+o.length,pos-c.length);
          if(inner.indexOf(o)>=0)continue;
          var range=document.createRange();range.setStart(node,oi);range.setEnd(node,pos);
          var el=document.createElement(tag);
          try{range.surroundContents(el);}catch(e){continue;}
          var ar=document.createRange();ar.setStartAfter(el);ar.collapse(true);
          sel.removeAllRanges();sel.addRange(ar);return;
        }
      }
    }
    if(txt.slice(pos-1,pos)==="*"&&txt.slice(pos-2,pos-1)!=="*"){
      var oi2=txt.lastIndexOf("*",pos-1);
      if(oi2>=0&&oi2<pos-1){
        var inner2=txt.slice(oi2+1,pos-1);
        if(inner2.indexOf("*")>=0)return;
        var rng2=document.createRange();rng2.setStart(node,oi2);rng2.setEnd(node,pos);
        var em=document.createElement("em");
        try{rng2.surroundContents(em);}catch(e){return;}
        var ar2=document.createRange();ar2.setStartAfter(em);ar2.collapse(true);
        sel.removeAllRanges();sel.addRange(ar2);
      }
    }
    /* E5：打出 ]] 时，把 [[标题]] 实时变成双链（语法只是加速，工具栏「引用笔记」是主通道） */
    if(txt.slice(pos-2,pos)==="]]"){
      var oi3=txt.lastIndexOf("[[",pos-2);
      if(oi3>=0){
        var inner3=txt.slice(oi3+2,pos-2);
        if(inner3.trim()&&inner3.indexOf("[[")<0&&inner3.indexOf("]]")<0){
          var range3=document.createRange();range3.setStart(node,oi3);range3.setEnd(node,pos);
          var a3=document.createElement("a");
          a3.className="wikilink"+(noteByTitle(inner3)?"":" missing");
          a3.setAttribute("data-wl",inner3);
          a3.setAttribute("href","javascript:void(0)");
          a3.textContent=inner3;
          try{range3.surroundContents(a3);}catch(e){return;}
          var ar3=document.createRange();ar3.setStartAfter(a3);ar3.collapse(true);
          sel.removeAllRanges();sel.addRange(ar3);
          noteEditDebounced();
        }
      }
    }
  }catch(e){}
}
function noteBlockShortcut(ed){
  try{
    var el=currentBlockEl(ed);if(!el)return;
    var txt=el.textContent||"",m;
    if((m=txt.match(/^(#{1,6})\s/))){
      var lv=m[1].length,rest=txt.slice(lv+1);
      document.execCommand("formatBlock",false,"H"+lv);
      var nb=currentBlockEl(ed);if(nb){nb.innerHTML=inlineMd(rest);placeCaretEnd(nb);}
      noteEditDebounced();return;
    }
    if(/^[-*+]\s/.test(txt)){document.execCommand("insertUnorderedList");cleanupListMarker(ed);noteEditDebounced();return;}
    if(/^\d+[.)]\s/.test(txt)){document.execCommand("insertOrderedList");cleanupListMarker(ed);noteEditDebounced();return;}
    if(/^>\s?/.test(txt)){document.execCommand("formatBlock",false,"BLOCKQUOTE");var nb2=currentBlockEl(ed);if(nb2){nb2.innerHTML=inlineMd(txt.replace(/^>\s?/,""));placeCaretEnd(nb2);}noteEditDebounced();return;}
    if(/^```/.test(txt)){document.execCommand("formatBlock",false,"PRE");var nb3=currentBlockEl(ed);if(nb3){nb3.innerHTML="<code></code>";placeCaretStart(nb3.querySelector("code")||nb3);}noteEditDebounced();return;}
  }catch(e){}
}
function cleanupListMarker(ed){
  var sel=window.getSelection();if(!sel.rangeCount)return;
  var node=sel.anchorNode;var li=node.nodeType===3?node.parentElement:node;
  while(li&&li.tagName&&li.tagName.toLowerCase()!=="li")li=li.parentElement;
  if(li){li.textContent=li.textContent.replace(/^[-*+]\s+/,"").replace(/^\d+[.)]\s+/,"");}
}
function wrapSelection(tag){
  var sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return;
  var r=sel.getRangeAt(0),el=document.createElement(tag);
  try{r.surroundContents(el);}catch(e){return;}
  placeCaretEnd(el);
}
function noteCmd(cmd){
  var ed=document.getElementById("noteEditor");if(!ed)return;
  ed.focus();
  if(cmd==="bold")document.execCommand("bold");
  else if(cmd==="italic")document.execCommand("italic");
  else if(cmd==="underline")document.execCommand("underline");
  else if(cmd==="strike")document.execCommand("strikeThrough");
  else if(/^h[1-6]$/.test(cmd))document.execCommand("formatBlock",false,cmd.toUpperCase());
  else if(cmd==="ul")document.execCommand("insertUnorderedList");
  else if(cmd==="ol")document.execCommand("insertOrderedList");
  else if(cmd==="quote")document.execCommand("formatBlock",false,"BLOCKQUOTE");
  else if(cmd==="code"){document.execCommand("formatBlock",false,"PRE");var b=currentBlockEl(ed);if(b&&!b.querySelector("code"))b.innerHTML="<code></code>";ed.focus();placeCaretStart(b&&b.querySelector("code")?b.querySelector("code"):b);}
  else if(cmd==="inline"){wrapSelection("code");}
  else if(cmd==="link"){openLinkModal();return;}
  else if(cmd==="hr"){document.execCommand("insertHorizontalRule");}
  else if(cmd==="preview"){toggleNotePreview();return;}
  else if(cmd==="autonum"){ui.noteAutoNum=!ui.noteAutoNum;var wrap=document.querySelector(".notes");if(wrap)wrap.classList.toggle("note-auto",ui.noteAutoNum);var btn=document.querySelector('[data-cmd="autonum"]');if(btn)btn.classList.toggle("on",ui.noteAutoNum);return;}
  noteEditDebounced();
}

function matchesSmart(t,q){
  if(q.open&&t.done)return false;
  if(Array.isArray(q.pri)&&q.pri.length&&q.pri.indexOf(t.priority)<0)return false;
  if(q.client&&t.clientId!==q.client)return false
  if(q.project&&t.projectId!==q.project)return false;
  if(q.tag){if(!Array.isArray(t.tags)||t.tags.indexOf(q.tag)<0)return false}
  if(q.important&&!t.important)return false;
  return true;
}
function filtered(){

  return db.tasks.filter(function(t){
    if(ui.pid!=="all"){var k=t.projectId||"none";if(k!==ui.pid)return false}
    if(ui.cid!=="all"){if(ui.cid==="none"){if(t.clientId)return false}else{if(t.clientId!==ui.cid)return false}}
    if(ui.tag){if(!Array.isArray(t.tags)||t.tags.indexOf(ui.tag)<0)return false}
    if(sq&&!matchesSmart(t,sq))return false;
    if(ui.pf!=="all"&&t.priority!==ui.pf)return false;

    if(t.title.toLowerCase().indexOf(q)>=0)return true;
    if((t.note||"").toLowerCase().indexOf(q)>=0)return true;
    for(var i=0;i<(t.subtasks||[]).length;i++)if(t.subtasks[i].title.toLowerCase().indexOf(q)>=0)return true;

  });

function sortTasks(a){
  var w={high:0,mid:1,low:2};
  return a.slice().sort(function(x,y){
    if(x.done!==y.done)return x.done?1:-1;
    if(x.done)return (y.doneAt||0)-(x.doneAt||0);
    var dx=x.due?dayDiff(x.due):9999,dy=y.due?dayDiff(y.due):9999;
    if(dx!==dy)return dx-dy;

  });
}

    '<span class="ctt">'+esc(t.title)+'</span>'+
    (t.due?('<span class="chip '+(dayDiff(t.due)<0?"od":"")+'">'+fmtDue(t.due)+'</span>'):"")+
    (p?'<span class="ckprj">'+esc(p.name)+'</span>':"")+'</div>';
}
function calMonth(selDate,sel){
  var y=selDate.getFullYear(),m=selDate.getMonth();
  var start=weekStart(new Date(y,m,1));var td=today();
  var cells=[];for(var i=0;i<42;i++)cells.push(shift(start,i));
  var head=["一","二","三","四","五","六","日"].map(function(w){return '<div class="cdow">'+w+'</div>'}).join("");
  var body=cells.map(function(d){
    var ds=ymd(d),inM=d.getMonth()===m,isT=ds===td,isS=ds===sel;
    var ts=db.tasks.filter(function(t){return t.due===ds}).sort(function(a,b){return (a.done?1:0)-(b.done?1:0)});
    var od=ts.some(function(t){return !t.done&&dayDiff(ds)<0});
    var maxT=3;
    var items=ts.slice(0,maxT).map(function(t){
      return '<div class="ct'+(t.done?" done":"")+(!t.done&&dayDiff(ds)<0?" od":"")+'" data-act="edit" data-id="'+t.id+'"><span class="cdot" style="background:'+dotColor(t)+'"></span><span class="ctt">'+esc(t.title)+'</span></div>';
    }).join("");
    if(ts.length>maxT)items+='<div class="cmore">+'+(ts.length-maxT)+" 项</div>";
    return '<div class="ccell'+(inM?"":" out")+(isT?" today":"")+(isS?" sel":"")+(od?" hasod":"")+(ts.length?" has":"")+'" data-act="calPick" data-id="'+ds+'">'+
      '<div class="cnum">'+d.getDate()+'</div>'+items+'</div>';
  }).join("");
  return '<div class="cal-grid">'+head+body+'</div>';
}
function calWeek(selDate,sel){
  var ws=weekStart(selDate);var td=today();
  var head=["一","二","三","四","五","六","日"];
  var h='<div class="cal-week">';
  for(var i=0;i<7;i++){
    var d=shift(ws,i),ds=ymd(d),isT=ds===td,isS=ds===sel;
    var ts=db.tasks.filter(function(t){return t.due===ds});
    var cards=ts.length?ts.map(function(t){return '<div class="wc'+(t.done?" done":"")+(!t.done&&dayDiff(ds)<0?" od":"")+'" data-act="edit" data-id="'+t.id+'">'+esc(t.title)+'</div>'}).join(""):'<div class="wempty">—</div>';
    h+='<div class="wcol'+(isT?" today":"")+(isS?" sel":"")+'" data-act="calPick" data-id="'+ds+'">'+
      '<div class="wdow">'+head[i]+'</div><div class="wdate'+(isT?" today":"")+'">'+d.getDate()+'</div><div class="wcards">'+cards+'</div></div>';
  }
  h+="</div>";
  return h;
}

function viewQuadrant(){
  var acts=db.tasks.filter(function(t){return !t.done});
  function imp(t){return !!t.important}
  function urg(t){return !!t.due&&dayDiff(t.due)<=3}
  var q1=acts.filter(function(t){return imp(t)&&urg(t)});
  var q2=acts.filter(function(t){return imp(t)&&!urg(t)});
  var q3=acts.filter(function(t){return !imp(t)&&urg(t)});
  var q4=acts.filter(function(t){return !imp(t)&&!urg(t)});
  function col(title,arr,cls,qn){
    var body=arr.length?arr.map(function(t){
      return '<div class="qcard'+(t.important?" important":"")+'" data-qid="'+t.id+'" data-act="edit" data-id="'+t.id+'">'+
        '<div class="qtitle">'+(t.important?'<span class="qimp">★</span>':'')+esc(t.title)+'</div>'+
        '<div class="qmeta">'+(t.due?('<span class="chip '+(dayDiff(t.due)<0?"od":"")+'">'+fmtDue(t.due)+'</span>'):"")+
        (priKey(t.priority)!=="low"?'<span class="chip '+priKey(t.priority)+'">'+PRI[priKey(t.priority)]+'</span>':"")+'</div>'+
        '<div class="qfoot">'+
          '<select class="qsel" data-chg="cardStatus" data-id="'+t.id+'">'+["todo","doing","done"].map(function(s){return '<option value="'+s+'"'+(statusOf(t)===s?" selected":"")+'>'+stLabel(s)+'</option>';}).join("")+'</select>'+
          '<select class="qsel" data-chg="cardPri" data-id="'+t.id+'">'+["high","mid","low"].map(function(p){return '<option value="'+p+'"'+(t.priority===p?" selected":"")+'>'+PRI[p]+'</option>';}).join("")+'</select>'+
        '</div></div>';
    }).join(""):'<div class="qempty">把任务拖进来</div>';
    return '<div class="qcol '+cls+'" data-quad="'+qn+'"><div class="qhead">'+title+'<span class="qc">'+arr.length+'</span></div><div class="qbody">'+body+'</div></div>';
  }
  return '<div class="view-head"><div class="vh-title">'+icon(IC.quad,18)+"四象限</div>"+
    '<div class="vh-tip muted">紧急 ≈ 近 3 天有截止；重要 ≈ 标「重要」。可拖拽卡片在象限间移动以调整 重要 / 紧急 归属；卡片下方下拉框亦可切换状态 / 优先级</div></div>'+
    '<div class="quad">'+col("重要 · 紧急",q1,"q1",1)+col("重要 · 不紧急",q2,"q2",2)+col("紧急 · 不重要",q3,"q3",3)+col("不重要 · 不紧急",q4,"q4",4)+"</div>";
}


/* 「任务」页顶部的呈现切换器 —— 位于页面最上方，是进入看板的唯一入口。
   一个任务库、两种看法：列表看"接下来做什么"，看板看"各状态各有多少"。
   这样「今天 / 任务 / 看板」三个同源入口收敛为「今天（时间焦点）+ 任务（全库 + 呈现切换）」。 */
function taskModeSwitch(){

  return '<div class="view-head tmode-head"><div class="seg tmode-seg">'+
    seg("list","列表",IC.list)+seg("board","看板",IC.board)+
    '</div><div class="vh-tip muted">'+(m==="board"?"按住卡片拖动到其他列即可切换状态":"列表按截止时间排序，越近越靠前")+"</div></div>";

/* 空结果时把「到底哪些条件在生效」说清楚 —— 否则 KPI 钻取留下的口径会让人摸不着头脑 */
function activeFilterNames(){
  var n=[];
  if(ui.kf!=="all"&&KF_LABEL[ui.kf])n.push(KF_LABEL[ui.kf]);
  if(ui.pf!=="all")n.push("优先级 "+({high:"高",mid:"中",low:"低"}[ui.pf]||ui.pf));
  if(ui.pid!=="all")n.push(ui.pid==="none"?"未归类":"项目");
  if(ui.cid!=="all")n.push(ui.cid==="none"?"无客户":"客户");

  if(ui.smart)n.push("智能列表");

  return n.join("、")||"无";

function filteredEmpty(){
  return emptyState({icon:IC.list,title:db.tasks.length?"没有符合条件的任务":"还没有任务",
    why:db.tasks.length?"当前生效的筛选："+activeFilterNames()+"。<br>清掉筛选就能看到全部任务。":"在最上面的输入框写一句、按回车就加上了。",
    acts:db.tasks.length?[{label:"清空筛选",act:"bprojClear"}]:[{label:"写一条任务",act:"newTask",primary:1,icon:IC.plus}]});
}
function viewAll(){
  var board=ui.taskMode==="board";

  if(board)return h+kanban(boardTasks());
  var a=sortTasks(kpiFiltered());
  var undone=a.filter(function(t){return !t.done}),done=a.filter(function(t){return t.done});
  /* 从 KPI「已完成」钻进来时，已完成才是主角，「进行中」空块不再出现 */

function taskCard(t){
  var p=proj(t.projectId),c=t.clientId?clientById(t.clientId):null,d=t.due?dayDiff(t.due):null,od=!t.done&&d!==null&&d<0;

  h+='<div class="ttl'+(t.done?" done":"")+'"><span data-act="edit" data-id="'+t.id+'" style="cursor:pointer">'+esc(t.title)+"</span>";

  if(priKey(t.priority)!=="low")h+='<span class="chip '+priKey(t.priority)+'">'+icon(IC.flag,11)+PRI[priKey(t.priority)]+"</span>";

  if(t.due)h+='<span class="chip '+(od?"od":d===0?"due":"")+'">'+(od?"逾期 "+(-d)+" 天":d===0?"今天截止":t.due.slice(5).replace("-","月")+"日")+"</span>";
  if(t.note)h+='<span class="chip">备注</span>';
  var noteCnt=0;if(t.noteId&&noteById(t.noteId))noteCnt++;t.subtasks.forEach(function(s){if(s.noteId&&noteById(s.noteId))noteCnt++});
  /* E7：与任务的闭环 —— 徽标直接显示笔记标题（而不是"N 篇笔记"），悬停看摘要；

        '<div class="lp-body">'+esc(lp.text)+'</div>'+

  }else{

        (ed
          ? '<div class="subedit-row"><input id="subEdit" class="subedit" data-tid="'+t.id+'" data-sid="'+s.id+'" value="'+esc(s.title)+'">'+dateTrigger("subdue_"+s.id,s.due,true)+uiSelect("subPri",s.priority,[{v:"",label:"无"},{v:"high",label:"高"},{v:"mid",label:"中"},{v:"low",label:"低"}])+'</div>'
          : '<span class="st'+(s.done?" done":"")+'" data-tid="'+t.id+'" data-sid="'+s.id+'">'+esc(s.title)+'</span>'+(s.due?'<button class="subdue'+(t.due&&dayDiff(s.due)>dayDiff(t.due)?" od":"")+'" data-act="editSubDue" data-id="'+t.id+'" data-sid="'+s.id+'" title="点击修改截止时间">'+fmtDue(s.due)+'</button>':"")+(s.priority?'<button class="spri '+s.priority.toLowerCase()+'" data-act="cycleSubPri" data-id="'+t.id+'" data-sid="'+s.id+'" title="优先级 '+PRI[s.priority]+'，点击切换">'+PRI[s.priority]+'</button>':'<button class="spri-add" data-act="cycleSubPri" data-id="'+t.id+'" data-sid="'+s.id+'" title="设置优先级">'+icon(IC.flag,11)+"</button>")+'<button class="ico edit" data-act="editSub" data-id="'+t.id+'" data-sid="'+s.id+'" title="编辑">'+icon(IC.pencil,13)+"</button>")+
        '<button class="del" data-act="delSub" data-id="'+t.id+'" data-sid="'+s.id+'">'+icon(IC.x,13)+"</button></div>";
    });
    h+='<div class="subadd"><input data-sub="'+t.id+'" placeholder="＋ 添加子任务，回车确认"></div></div>';
  }else if(!t.subtasks.length){
    h+='<div class="subadd solo"><input data-sub="'+t.id+'" placeholder="＋ 添加子任务，回车确认"></div>';
  }
  return h+"</div>";
}

function ring(p,size){
  size=size||42;var r=(size-6)/2,c=2*Math.PI*r;

function viewProjects(){
  var yr=ui.projYear, curY=new Date().getFullYear();
  var years=[];db.projects.forEach(function(p){if(p.landYear&&years.indexOf(p.landYear)<0)years.push(p.landYear)});years.sort(function(a,b){return a-b});
  var pros = yr==="all"?db.projects:db.projects.filter(function(p){return p.landYear===yr});
  var budgetSum=0,hi=0,mid=0,lo=0;
  pros.forEach(function(p){budgetSum+=p.budget;if(p.landing==="high")hi++;else if(p.landing==="mid")mid++;else if(p.landing==="low")lo++;});
  var contractByYear={};
  db.projects.forEach(function(p){
    var st=stageById(p.status);
    if(st&&st.landed===1&&p.isContract&&p.contract>0){
      var y=p.landYear||0;
      if(yr==="all"||yr===y)contractByYear[y]=(contractByYear[y]||0)+p.contract;
    }
  });
  var cyKeys=Object.keys(contractByYear).sort(function(a,b){return (+a)-(+b)});
  var maxC=0;cyKeys.forEach(function(y){if(contractByYear[y]>maxC)maxC=contractByYear[y]});

/* ---------- 报告：通用周期引擎（周 / 月 / 季 / 半年 / 年） ---------- */
var LOG_TYPES=[{k:"note",i:"✎",n:"跟进"}];
var PERIODS=[["week","周报"],["month","月报"],["year","年报"],["half","半年报"],["custom","自定义"]];
function periodName(ty){for(var i=0;i<PERIODS.length;i++)if(PERIODS[i][0]===ty)return PERIODS[i][1];return "报告"}
function nextName(ty){return{week:"下周",month:"下月",quarter:"下季度",half:"下一阶段",year:"明年"}[ty]||"下一阶段"}

/* off = 0 当前期，-1 上一期，+1 下一期。跨年由 Date 自动进位 */
function periodRange(ty,off){
  var now=new Date();now.setHours(0,0,0,0);
  var s,e,label,gran;
  if(ty==="custom"){
    var cs=ui.customStart||ymdStr(new Date(now.getFullYear(),now.getMonth(),1));
    var ce=ui.customEnd||ymd(today());
    s=parseYmd(cs);e=new Date(+parseYmd(ce)+864e5);
    label=cs+" ~ "+ce;gran="day";
  }else if(ty==="month"){
    s=new Date(now.getFullYear(),now.getMonth()+off,1);
    e=new Date(s.getFullYear(),s.getMonth()+1,1);
    label=s.getFullYear()+"年 "+(s.getMonth()+1)+"月";gran="day";
  }else if(ty==="half"){
    s=new Date(now.getFullYear(),(Math.floor(now.getMonth()/6)+off)*6,1);
    e=new Date(s.getFullYear(),s.getMonth()+6,1);
    label=s.getFullYear()+"年 "+(s.getMonth()<6?"上半年":"下半年");gran="month";
  }else if(ty==="year"){
    s=new Date(now.getFullYear()+off,0,1);
    e=new Date(s.getFullYear()+1,0,1);
    label=s.getFullYear()+"年";gran="month";
  }else{
    s=weekStart(now);s.setDate(s.getDate()+off*7);
    e=new Date(s);e.setDate(e.getDate()+7);
    var ed=shift(s,6);
    label=(s.getMonth()+1)+"月"+s.getDate()+"日 ~ "+(ed.getMonth()+1)+"月"+ed.getDate()+"日";
    if(s.getFullYear()!==now.getFullYear())label=s.getFullYear()+"年 "+label;
    gran="day";
  }
  return{type:ty,s:s,e:e,label:label,gran:gran,range:ymd(s)+" ~ "+ymd(new Date(+e-864e5))};
}


function inScope(t,pid){return pid==="all"?true:(pid==="none"?!t.projectId:t.projectId===pid)}
function scopeName(pid){
  if(pid==="all")return "全部项目";
  if(pid==="none")return "未归类";
  var p=proj(pid);return p?p.name:"未知项目";
}

/* 汇总某个区间 + 某个项目范围内的所有数据 */
function collectPeriod(r,pid){
  var a=+r.s,b=+r.e,inP=function(ts){return !!ts&&ts>=a&&ts<b};
  var scope=db.tasks.filter(function(t){return inScope(t,pid)});
  var doneT=scope.filter(function(t){return t.done&&inP(t.doneAt)});
  doneT.sort(function(x,y){return x.doneAt-y.doneAt});
  var subs=[];scope.forEach(function(t){(t.subtasks||[]).forEach(function(x){if(x.done&&inP(x.doneAt))subs.push({t:t,s:x})})});
  var logs=[];scope.forEach(function(t){(t.logs||[]).forEach(function(l){if(inP(l.at))logs.push({t:t,l:l})})});
  logs.sort(function(x,y){return x.l.at-y.l.at});
  var going=scope.filter(function(t){return !t.done});
  var overdue=going.filter(function(t){return t.due&&dayDiff(t.due)<0});
  var created=scope.filter(function(t){return inP(t.createdAt)});
  return{r:r,pid:pid,scope:scope,doneT:doneT,subs:subs,logs:logs,going:going,overdue:overdue,created:created};
}

    var pids=d.pid==="all"?db.projects.map(function(pp){return pp.id}).filter(function(id){return pgroups[id]&&pgroups[id].length}):[d.pid];
    if(pids.length){
      lines.push("【各项目进度】");
      pids.forEach(function(id){
        var p=proj(id);if(!p)return;
        var ts=pgroups[id]||[],tt=ts.length,dt=ts.filter(function(t){return t.done}).length,totSub=0,doneSub=0;
        ts.forEach(function(t){(t.subtasks||[]).forEach(function(s){totSub++;if(s.done)doneSub++})});
        var denom=tt+totSub,pct=denom?Math.round((dt+doneSub)/denom*100):0;

      });

    }
  }

  var keys={};d.doneT.forEach(function(t){keys[t.projectId||"none"]=1});d.subs.forEach(function(x){keys[x.t.projectId||"none"]=1});

  if(d.logs.length){
    lines.push("【关键进展】");

    lines.push("");
  }
  var planned=d.going.filter(function(t){return t.planned});

  if(nextList.length){
    lines.push("【"+nextName(r.type)+"计划】"+(planned.length?"":"（未勾选，自动列出进行中的前 10 项）"));
    nextList.forEach(function(t){

    });

  }
  if(d.overdue.length){
    lines.push("【需要关注 · 已逾期 "+d.overdue.length+" 项】");
    d.overdue.slice(0,8).forEach(function(t){lines.push("- "+t.title+" 已逾期 "+Math.abs(dayDiff(t.due))+" 天")});

  }
  lines.push("本期合计：完成任务 "+d.doneT.length+" 项，完成子任务 "+d.subs.length+" 项，新增任务 "+d.created.length+" 项，进行中 "+d.going.length+" 项。");
  return lines.join("\n");
}

/* 剪贴板封装：优先 Tauri 系统剪贴板插件（macOS NSPasteboard，双向可靠），
   失败再退回 navigator.clipboard，最后退回 execCommand。 */
async function clipWrite(t){
  try{await writeText(t);return true}catch(e){}
  try{if(navigator.clipboard){await navigator.clipboard.writeText(t);return true}}catch(e){}
  try{var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";ta.style.top="0";ta.style.left="0";document.body.appendChild(ta);ta.focus();ta.select();var ok=document.execCommand("copy");document.body.removeChild(ta);return ok}catch(e){}
  return false;
}
async function clipRead(){
  try{return await readText()}catch(e){}
  try{if(navigator.clipboard){return await navigator.clipboard.readText()}}catch(e){}
  return null;
}
/* 把文本插入当前聚焦的可编辑元素（input/textarea/contenteditable）光标处 */
function insertAtCursor(txt){
  var ae=document.activeElement;
  if(!ae||!ae.closest||!ae.closest("input,textarea,[contenteditable=true]"))return false;
  if(ae.isContentEditable){document.execCommand("insertText",false,txt);return true;}
  if(typeof ae.setRangeText==="function"){
    var s=ae.selectionStart==null?ae.value.length:ae.selectionStart, en=ae.selectionEnd==null?ae.value.length:ae.selectionEnd;
    ae.setRangeText(txt,s,en,"end");
    ae.dispatchEvent(new Event("input",{bubbles:true}));
    ae.dispatchEvent(new Event("change",{bubbles:true}));
    return true;
  }
  return false;
}
async function copyText(str){
  return await clipWrite(str||"");
}

function addTask(){
  var t=$("#qt");if(!t)return;
  var raw=t.value.trim();if(!raw){t.focus();return}
  var pt=parseTitle(raw);
  if(ui.tag&&pt.tags.indexOf(ui.tag)<0)pt.tags.push(ui.tag);/* 侧栏正筛某标签时，新任务自动带上 */
  var gv=function(x){var e=$("#"+x);return e?e.value:""};
  var cid=gv("qc"),pid=gv("qp"),pri=pt.pri||gv("qpri");
  if(!PRI[pri])pri="low";
  var due=pt.due||gv("qd")||"";
  db.tasks.unshift({id:uid(),title:pt.title,clientId:cid,projectId:pid,priority:pri,due:due,note:"",done:false,doneAt:0,status:"todo",createdAt:Date.now(),
    planned:false,important:pt.important||false,tags:pt.tags,subtasks:[],logs:[],noteId:""});
  db.prefs={pid:pid,pri:pri};/* D1：记住这次的选择 */

/* 删除标签时，把它的 id 从所有任务与笔记的 tags 数组里摘掉。
   只清任务会留下"指向已删标签的孤儿 id"：界面上看不到，但会被写回库里，数据缓慢脏化，
   而且以后重建同名标签也认不回来。 */
function purgeTagId(tid){
  [db.tasks,db.notes].forEach(function(arr){
    (arr||[]).forEach(function(o){
      if(!Array.isArray(o.tags))return;
      var k=o.tags.indexOf(tid);
      if(k>=0)o.tags.splice(k,1);
    });
  });
}

  if(a==="openSnapDir"){invoke("reveal_dir",{which:"snapshots"}).then(function(){toast("已打开快照目录")}).catch(function(e){toast("打开失败："+(e&&e.message?e.message:e))});return true}
  if(a==="refreshSnapInfo"){refreshSnapInfo().then(function(){openSettings();toast("已刷新")}).catch(function(e){toast("刷新失败："+(e&&e.message?e.message:e))});return true}
  if(a==="aiTest"){
    var btn=el,old=btn.innerHTML;
    btn.disabled=true;btn.innerHTML="测试中…";
    invoke("ai_chat",{
      baseUrl:($("#aiBase").value||"").trim(),

      user:"请只回复两个字：正常"

/* ---------- 指针拖拽（看板 / 四象限）：替代原生 HTML5 DnD，兼容 Tauri WebView ---------- */
var DRAG=null,DRAG_SUPPRESS=false;
function dragColUnder(x,y){
  var el=document.elementFromPoint(x,y);
  return el?el.closest("[data-quad],[data-drop]"):null;
}
function dragCleanup(d){
  d=d||DRAG;
  if(d){
    if(d.clone)d.clone.remove();
    if(d.el)d.el.classList.remove("drag-src");
  }
  document.body.classList.remove("dragging-active");
  document.querySelectorAll(".drag-ghost").forEach(function(g){g.remove()});
  document.querySelectorAll(".drag-src").forEach(function(c){c.classList.remove("drag-src")});
  document.querySelectorAll(".qcol.drag-over,.kcol.drag-over").forEach(function(c){c.classList.remove("drag-over")});
}
document.addEventListener("pointerdown",function(e){
  if(e.button!==0)return;
  if(DRAG)return;
  var card=e.target.closest(".qcard,.kcard");
  if(!card)return;
  if(e.target.closest("select,input,textarea,button,.qsel,.ksel"))return;
  DRAG={id:card.classList.contains("qcard")?card.dataset.qid:card.dataset.kid,
        kind:card.classList.contains("qcard")?"quad":"board",
        el:card,sx:e.clientX,sy:e.clientY,moved:false,clone:null,offX:0,offY:0};
});
document.addEventListener("pointermove",function(e){
  if(!DRAG)return;
  if(DRAG.moved&&!(e.buttons&1)){dragEnd(e);return;}
  if(!DRAG.moved){
    if(Math.abs(e.clientX-DRAG.sx)<6&&Math.abs(e.clientY-DRAG.sy)<6)return;
    DRAG.moved=true;
    var r=DRAG.el.getBoundingClientRect();
    var cl=DRAG.el.cloneNode(true);
    cl.classList.add("drag-ghost");cl.classList.remove("drag-src");
    cl.style.width=r.width+"px";cl.style.height=r.height+"px";
    cl.style.left=e.clientX+"px";cl.style.top=e.clientY+"px";
    document.body.appendChild(cl);
    DRAG.clone=cl;DRAG.offX=e.clientX-r.left;DRAG.offY=e.clientY-r.top;
    DRAG.el.classList.add("drag-src");
    document.body.classList.add("dragging-active");
  }
  if(DRAG.clone){DRAG.clone.style.left=(e.clientX-DRAG.offX)+"px";DRAG.clone.style.top=(e.clientY-DRAG.offY)+"px";}
  var col=dragColUnder(e.clientX,e.clientY);
  document.querySelectorAll(".qcol.drag-over,.kcol.drag-over").forEach(function(c){c.classList.remove("drag-over")});
  if(col)col.classList.add("drag-over");
});
function dragEnd(e){
  if(!DRAG)return;
  var d=DRAG;DRAG=null;
  if(d.moved){
    var col=dragColUnder(e.clientX,e.clientY);
    var tk=task(d.id),changed=false;
    if(tk&&col){
      if(d.kind==="quad"){
        var qn=+col.dataset.quad;
        if(qn!==quadOf(tk)){
          tk.important=(qn===1||qn===2);
          var wantUrgent=(qn===1||qn===3);
          if(wantUrgent){ if(!tk.due||dayDiff(tk.due)>3){ tk.due=ymd(shift(new Date(),2)); } }
          else { if(tk.due&&dayDiff(tk.due)<=3){ tk.due=ymd(shift(new Date(),5)); } }
          save();toast("已移至："+quadName(qn));changed=true;
        }
      }else{
        var st=col.dataset.drop;
        if(st&&st!==statusOf(tk)){ setStatus(tk,st);save();toast("状态："+stLabel(st));changed=true; }
      }
    }
    dragCleanup(d);
    DRAG_SUPPRESS=true;
    if(changed)renderMain();
    setTimeout(function(){DRAG_SUPPRESS=false;},0);
  }else{
    dragCleanup(d);
  }
}
document.addEventListener("pointerup",dragEnd);
document.addEventListener("pointercancel",function(e){if(DRAG){var d=DRAG;DRAG=null;dragCleanup(d);}});
window.addEventListener("blur",function(){if(DRAG){var d=DRAG;DRAG=null;dragCleanup(d);}});

/* ---------- ⌘K 统一命令面板：录入 / 搜索 / 跳视图 ---------- */
var palIdx=0,palItems=[];
function openPalette(){var p=$("#palette");if(!p)return;$("#pq").value="";p.classList.add("open");setTimeout(function(){$("#pq").focus()},20);renderPalette("")}
function closePalette(){var p=$("#palette");if(p)p.classList.remove("open");palItems=[];palIdx=0}
function renderPalette(q){
  q=(q||"").trim();
  var items=[];
  var cmds=[["今天","today"],["任务","all"],["看板","board"],["总览","dashboard"]];
  if(!q){
    cmds.forEach(function(c){items.push({type:"jump",label:c[0],act:c[1],hint:"跳转"})});
  }else{
    items.push({type:"add",label:q,hint:"新建任务"});
    items.push({type:"search",label:q,hint:"搜索"});
    cmds.forEach(function(c){if(c[0].indexOf(q)>=0)items.push({type:"jump",label:c[0],act:c[1],hint:"跳转"})});
    var mq=q.toLowerCase();
    db.tasks.filter(function(t){return !t.done&&t.title.toLowerCase().indexOf(mq)>=0}).slice(0,8).forEach(function(t){var p=proj(t.projectId);items.push({type:"open",id:t.id,label:t.title,hint:p?p.name:"未归类"})});
  }
  palItems=items;palIdx=0;
  $("#plist").innerHTML=items.length?items.map(function(it,i){
    var ic=it.type==="add"?IC.plus:it.type==="search"?IC.list:it.type==="open"?IC.check:IC.right;
    var cls="pitem"+(i===palIdx?" on":"")+(it.type==="add"?" add":"");
    var main=it.type==="add"?("<b>新建任务：</b>"+esc(it.label)):esc(it.label);
    return '<div class="'+cls+'" data-pi="'+i+'">'+icon(ic,16)+"<span>"+main+"</span>"+(it.hint?'<span class="sub">'+esc(it.hint)+"</span>":"")+"</div>";
  }).join(""):'<div class="pitem def">没有匹配的内容</div>';
}
function execPalette(i){
  var it=palItems[i==null?palIdx:i];if(!it)return;
  closePalette();
  if(it.type==="add"){
    var pt=parseTitle(it.label);
    db.tasks.unshift({id:uid(),title:pt.title,clientId:"",projectId:"",priority:priKey(pt.pri),due:pt.due,note:"",done:false,doneAt:0,status:"todo",createdAt:Date.now(),subtasks:[],logs:[],tags:pt.tags,planned:false,important:pt.important||false,noteId:""});
    save();ui.view="all";ui.q="";ui.pf="all";render();
    var bits=[];if(pt.important)bits.push("★ 重要");if(pt.due)bits.push("截止 "+fmtDate(pt.due));if(pt.pri)bits.push(PRI[pt.pri]);if(pt.tags.length)bits.push(pt.tags.length+" 个标签");
    toast("已添加"+(bits.length?("："+bits.join(" · ")):""));
  }else if(it.type==="search"){
    ui.q=it.label;ui.view="all";render();
  }else if(it.type==="jump"){
    /* 「任务」= 同页面的列表形态；「看板」= 同页面切到看板形态 */
    if(it.act==="board"){ui.view="all";ui.taskMode="board";}
    else{ui.view=it.act;if(it.act==="all")ui.taskMode="list";}
    render();
  }else if(it.type==="open"){
    openTask(it.id);
  }
}

/* ---------- 新建任务快捷键：设置中可自定义 + 应用内兜底 ---------- */
var recording=false;
function accelToLabel(a){return (a||"").replace("CmdOrCtrl","⌘").replace("Ctrl","⌃").replace("Alt","⌥").replace("Shift","⇧").replace(/\+/g," ")}
function matchNewTaskShortcut(e){
  var raw=localStorage.getItem("ntsCombo");if(!raw)return false;
  var c;try{c=JSON.parse(raw)}catch(_){return false}
  var k=e.key===" "?"Space":(e.key.length===1?e.key.toUpperCase():e.key);
  return !!c&&e.metaKey===!!c.meta&&e.ctrlKey===!!c.ctrl&&e.altKey===!!c.alt&&e.shiftKey===!!c.shift&&k===c.key;
}
function handleShortcutRec(e){
  if(e.key==="Escape"){stopRec();return}
  var meta=e.metaKey,ctrl=e.ctrlKey,alt=e.altKey,shift=e.shiftKey;
  if(!(meta||ctrl||alt||shift)){toast("请同时按住 ⌘ / Ctrl / Alt / Shift 之一");return}
  var k=e.key===" "?"Space":(e.key.length===1?e.key.toUpperCase():null);
  if(!k){toast("请使用字母、数字或空格键");return}
  var parts=[];if(meta)parts.push("CmdOrCtrl");if(ctrl)parts.push("Ctrl");if(alt)parts.push("Alt");if(shift)parts.push("Shift");
  var accel=parts.join("+")+"+"+k;
  var combo={meta:meta,ctrl:ctrl,alt:alt,shift:shift,key:k};
  localStorage.setItem("ntsAccel",accel);
  localStorage.setItem("ntsCombo",JSON.stringify(combo));
  if(window.__TAURI_INTERNALS__)invoke("set_new_task_shortcut",{accel:accel}).catch(function(err){toast("设置失败："+(err&&err.message?err.message:err))});
  stopRec();
  var v=$("#scVal");if(v)v.textContent=accelToLabel(accel);
  toast("已设为 "+accelToLabel(accel));
}
function startRec(){recording=true;var b=$("#scRec");if(b){b.textContent="按下快捷键…";b.classList.add("rec")}}
function stopRec(){recording=false;var b=$("#scRec");if(b){b.textContent="点击录制";b.classList.remove("rec")}}
function updateScLabel(){var a=localStorage.getItem("ntsAccel")||"CmdOrCtrl+N";var v=$("#scVal");if(v)v.textContent=accelToLabel(a)}
document.addEventListener("keydown",function(e){
  if(recording){e.preventDefault();handleShortcutRec(e);return}
  if(matchNewTaskShortcut(e)){e.preventDefault();inlineCapture();return}
  var pal=$("#palette");
  if(pal&&pal.classList.contains("open")){
    if(e.key==="Escape"){closePalette();return}
    if(e.key==="ArrowDown"){e.preventDefault();palIdx=Math.min(palIdx+1,palItems.length-1);renderPalette($("#pq").value);return}
    if(e.key==="ArrowUp"){e.preventDefault();palIdx=Math.max(palIdx-1,0);renderPalette($("#pq").value);return}
    if(e.key==="Enter"){e.preventDefault();execPalette();return}
    return;
  }
  if(e.key==="Enter"&&(e.target.id==="subEdit"||e.target.id==="subPri")){e.preventDefault();saveSubEdit();return}
  if(e.key==="Escape"&&(e.target.id==="subEdit"||e.target.id==="subPri")){e.preventDefault();ui.editSub=null;renderMain();return}
  if(e.key==="Enter"&&e.target.id==="qt"){addTask();return}
  /* C1：就地新增行的 Esc = 收起这一行（大众习惯：Esc 取消） */
  if(e.key==="Escape"&&e.target.id==="qt"){e.target.value="";e.target.blur();return}
  if(e.key==="Enter"&&e.target.dataset.sub){
    var t=task(e.target.dataset.sub),v=e.target.value.trim();
    if(t&&v){t.subtasks.push({id:uid(),title:v,done:false,doneAt:0,priority:""});
      if(t.done){t.done=false;t.doneAt=0}
      save();renderMain();
      var next=document.querySelector('[data-sub="'+t.id+'"]');if(next)next.focus();
    }
    return;
  }
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="logInput"){e.preventDefault();var lb=document.querySelector('[data-act="addLog"]');if(lb)lb.click();return}
  if(e.key==="Enter"&&!e.shiftKey&&e.target.id==="qlInput"){e.preventDefault();var qb=document.querySelector('[data-act="quickLogSave"][data-id="'+ui.quickLog+'"]');if(qb)qb.click();return}
  if(e.key==="Escape"){closeModal();closeCtx();return}
  /* 第 0 步修复：原先 var meta 写在下面几行，而上面两处已经在用 meta，
     因变量提升此处恒为 undefined —— Ctrl/⌘+数字 切视图、Ctrl/⌘+\ 开关右栏其实一直不生效。 */
  var meta=e.metaKey||e.ctrlKey;
  if(meta&&/^[1-9]$/.test(e.key)){var vord=NAV_KEYS;var vi=+e.key-1;if(vord[vi]){e.preventDefault();if(ui.view==="notes")flushNoteEditor();ui.view=vord[vi];render();return;}}
  if(meta&&e.key==="\\"){e.preventDefault();var ins3=$("#insp");if(ins3){ins3.classList.toggle("collapsed");}renderMain();renderTopbar();return}
  if(meta&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return}
  if(meta&&e.key.toLowerCase()==="f"){e.preventDefault();openPalette();return}
  if(meta&&e.key===","){e.preventDefault();openSettings();return}
  if(meta&&e.key.toLowerCase()==="s"){e.preventDefault();document.querySelector('[data-act="export"]').click();return}
});

      var act=b.dataset.ctx;closeCtx();
      if(act==="ctxCut"||act==="ctxCopy"||act==="ctxPaste"||act==="ctxAll"){ctxEdit(act);return;}
      if(act==="ctxCopyTask"){copyText(t.title).then(function(ok){toast(ok?"已复制任务标题":"复制失败")});return;}
      /* 直接以「动作 + 目标 id」走主派发器。原先靠"在卡里找同名按钮再点它"，
         一旦卡片结构变化（比如把三个图标收敛成「⋯」）菜单就会变哑，现在不依赖卡内按钮。 */
      runSyntheticAct(act,ctxId,ctxRoot||document.body);
    });
  });
});
/* 「⋯」菜单与右键菜单执行动作的统一入口：
   造一个临时的隐藏 [data-act] 节点塞进容器并点击它，从而完整复用主派发器的既有逻辑。
   这样菜单项是否可用只取决于"动作是否存在"，而不再取决于卡片里恰好有没有同名按钮。 */
function runSyntheticAct(act,id,root){
  if(!act||!id)return;
  var tmp=document.createElement("button");
  tmp.setAttribute("data-act",act);tmp.setAttribute("data-id",id);
  tmp.style.display="none";
  (root||document.body).appendChild(tmp);
  tmp.click();
  tmp.remove();
}
async function ctxEdit(act){
  if(act==="ctxCopy"||act==="ctxCut"){
    var ae=document.activeElement, sel=window.getSelection();
    var fs=ae&&typeof ae.selectionStart==="number"&&ae.selectionStart!==ae.selectionEnd;
    var txt=fs?ae.value.substring(ae.selectionStart,ae.selectionEnd):(sel?sel.toString():"");
    if(!txt){toast("没有可复制的内容");return;}
    var ok=await clipWrite(txt);
    if(ok&&act==="ctxCut"){
      if(fs){ae.setRangeText("",ae.selectionStart,ae.selectionEnd,"end");ae.dispatchEvent(new Event("input",{bubbles:true}));ae.dispatchEvent(new Event("change",{bubbles:true}));}
      else if(sel){sel.deleteFromDocument();}
    }
    toast(ok?(act==="ctxCut"?"已剪切":"已复制"):"复制失败");return;
  }
  if(act==="ctxPaste"){
    var t=await clipRead();
    if(t==null){toast("剪贴板为空或无法读取");return;}
    if(insertAtCursor(t))toast("已粘贴");else toast("请先把光标放到输入框里");return;
  }
  if(act==="ctxAll"){
    var ae2=document.activeElement;
    if(ae2&&ae2.closest&&ae2.closest("input,textarea,[contenteditable=true]")){try{if(ae2.select)ae2.select();else document.execCommand("selectAll")}catch(err){}}
    return;
  }
}


/* 全局快捷键：⌘C/⌘X 复制、剪切选中内容；⌘V 粘贴到输入框（系统剪贴板插件，双向可靠） */
document.addEventListener("keydown",function(e){
  var mod=e.metaKey||e.ctrlKey;if(!mod)return;
  var k=e.key.toLowerCase();
  if(k==="c"||k==="x"){
    var ae=document.activeElement, sel=window.getSelection();
    var fs=ae&&typeof ae.selectionStart==="number"&&ae.selectionStart!==ae.selectionEnd;
    var ts=sel&&sel.toString().length>0;
    if(!fs&&!ts)return;
    var txt=fs?ae.value.substring(ae.selectionStart,ae.selectionEnd):sel.toString();
    if(!txt)return;
    e.preventDefault();
    clipWrite(txt).then(function(){ if(k==="x"){
      if(fs){ae.setRangeText("",ae.selectionStart,ae.selectionEnd,"end");ae.dispatchEvent(new Event("input",{bubbles:true}));ae.dispatchEvent(new Event("change",{bubbles:true}));}
      else if(sel){sel.deleteFromDocument();}
    }});
  }else if(k==="v"){
    var a2=document.activeElement;
    if(a2&&a2.closest&&a2.closest("input,textarea,[contenteditable=true]")){
      e.preventDefault();
      clipRead().then(function(t){ if(t==null)return; insertAtCursor(t); });
    }
  }
});

/* drag sort subtasks */
var dragFrom=null;
document.addEventListener("dragstart",function(e){
  var s=e.target.closest(".sub");if(!s)return;
  dragFrom={tid:s.dataset.tid,idx:+s.dataset.idx};s.classList.add("drag");
  e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain","x")}catch(err){}
});
document.addEventListener("dragover",function(e){if(dragFrom)e.preventDefault()});
document.addEventListener("drop",function(e){
  if(!dragFrom)return;
  var s=e.target.closest(".sub");if(!s||s.dataset.tid!==dragFrom.tid){dragFrom=null;renderMain();return}
  e.preventDefault();
  var t=task(dragFrom.tid),arr=t.subtasks,it=arr.splice(dragFrom.idx,1)[0];
  arr.splice(+s.dataset.idx,0,it);dragFrom=null;save();renderMain();
});
document.addEventListener("dragend",function(){dragFrom=null;var d=document.querySelector(".sub.drag");if(d)d.classList.remove("drag")});

/* ---------- boot ---------- */
Promise.all([load(),loadAI(),refreshSnapInfo()]).then(function(){render();if(!storageOK)banner("当前打开方式无法保存数据（浏览器禁用了本地存储）。请改用 Safari 打开，或把文件放到「文稿」目录再打开。","err");
  if(window.__TAURI_INTERNALS__){invoke("get_data_dir",{}).then(function(d){ui.dataDir=d}).catch(function(){});listen("menu",function(e){routeMenu(e.payload)}).catch(function(){});}
});
